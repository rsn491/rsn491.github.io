<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- if page.url == '/' or page.url == '/experience/' or page.url == '/projects/' -%}
  <link rel="stylesheet" href="{{ '/assets/css/experience.css' | relative_url }}">
  {%- endif -%}
  {%- if page.url == '/' -%}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ricardo Neves",
    "url": "{{ site.url }}/",
    "image": "{{ site.url }}/assets/profile.jpeg",
    "jobTitle": "Staff Software Engineer",
    "worksFor": { "@type": "Organization", "name": "Adyen" },
    "sameAs": [
      "https://github.com/rsn491",
      "https://linkedin.com/in/ricardo-neves-61656597",
      "https://twitter.com/ricardosn8",
      "https://medium.com/@rsn491"
    ]
  }
  </script>
  {%- endif -%}
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
