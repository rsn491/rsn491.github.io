<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ site.url }}{{ site.og_image | default: '/assets/profile.jpeg' }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
<meta name="twitter:image" content="{{ site.url }}{{ site.og_image | default: '/assets/profile.jpeg' }}">
<meta name="twitter:site" content="@{{ site.twitter.username }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author | default: site.title }}",
  "url": "{{ site.url }}",
  "description": "{{ site.description | strip_html | escape }}",
  "image": "{{ site.url }}{{ site.og_image | default: '/assets/profile.jpeg' }}",
  "sameAs": [
    "https://twitter.com/{{ site.twitter.username }}",
    "https://github.com/{{ site.github_username }}",
    "https://linkedin.com/in/{{ site.linkedin_username }}",
    "https://medium.com/@{{ site.medium_username }}"
  ]
}
</script>
